<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Partido</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-4">

    <section x-data="{ faltasLocal: 0, faltasVisita: 0, puntosLocal: 0, puntosVisita: 0 }" class="w-full max-w-5xl h-[500px] bg-zinc-950 border-4 border-zinc-800 rounded-xl p-6 shadow-2xl flex flex-col justify-between items-center">

        <section class="w-full flex justify-between items-start">
    
        <aside class="flex flex-col items-center space-y-2">
            <section class="bg-zinc-950 border-2 border-zinc-700 rounded-xl p-4 flex flex-col items-center space-y-2 shadow-2xl min-w-[160px]">
                <p class="text-red-600 text-sm font-serif font-black uppercase tracking-wider">Faltas</p>
                <p x-text="faltasLocal" class="text-amber-500 text-6xl md:text-5xl font-bold">0</p>
            </section>

            <aside class="flex space-x-4">
                <button type="button" @click="faltasLocal++" class="w-10 h-10 rounded-full border-2 border-zinc-400 text-zinc-300 font-bold text-xl cursor-pointer hover:bg-zinc-800 flex items-center justify-center">+</button>
                <button type="button" @click="if(faltasLocal > 0) faltasLocal--" class="w-10 h-10 rounded-full border-2 border-zinc-400 text-zinc-300 font-bold text-xl cursor-pointer hover:bg-zinc-800 flex items-center justify-center">-</button>
            </aside>
        </aside>

        <aside class="flex flex-col items-center space-y-2">
            <section class="bg-zinc-950 border-2 border-zinc-700 rounded-xl p-4 flex flex-col items-center space-y-2 shadow-2xl min-w-[160px]">
                <p class="text-red-600 text-sm font-serif font-black uppercase tracking-wider">Faltas</p>
                <p x-text="faltasVisita" class="text-amber-500 text-6xl md:text-5xl font-bold">0</p>
            </section>

            <aside class="flex space-x-4">
                <button type="button" @click="faltasVisita++" class="w-10 h-10 rounded-full border-2 border-zinc-400 text-zinc-300 font-bold text-xl cursor-pointer hover:bg-zinc-800 flex items-center justify-center">+</button>
                <button type="button" @click="if(faltasVisita > 0) faltasVisita--" class="w-10 h-10 rounded-full border-2 border-zinc-400 text-zinc-300 font-bold text-xl cursor-pointer hover:bg-zinc-800 flex items-center justify-center">-</button>
            </aside>
        </aside>

    </section>
        


        <div class="text-center flex flex-col items-center -mt-14">
            <div class="flex gap-3 mb-2">
                <button type="button" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold cursor-pointer">Iniciar</button>
                <button type="button" class="px-4 py-1.5 rounded-lg bg-red-600 hover:bg-red-500 text-white text-sm font-bold cursor-pointer">Detener</button>
                <button type="button" class="px-4 py-1.5 rounded-lg bg-zinc-700 hover:bg-zinc-600 text-white text-sm font-bold cursor-pointer">Reiniciar</button>
            </div>
            <p class="text-red-600 text-7xl md:text-8xl font-bold tracking-wider">24 : 00</p>
        </div>

        <div class="w-full flex justify-center gap-8 items-center mb-10">
            <aside class="flex flex-col space-y-2">
                <button type="button" @click="puntosLocal++" class="w-10 h-10 rounded-full border-2 border-zinc-400 text-zinc-300 font-bold text-xl cursor-pointer hover:bg-zinc-800 flex items-center justify-center">+</button>
                <button type="button" @click="if(puntosLocal > 0) puntosLocal--" class="w-10 h-10 rounded-full border-2 border-zinc-400 text-zinc-300 font-bold text-xl cursor-pointer hover:bg-zinc-800 flex items-center justify-center">-</button>
            </aside>
            
            <section class="bg-zinc-950 border-2 border-zinc-700 rounded-xl p-4 flex flex-col items-center space-y-2 shadow-2xl min-w-[160px]">
                <p class="text-zinc-300 text-sm font-semibold uppercase tracking-wider">Equipo local</p>
                <p x-text="puntosLocal" class="text-amber-500 text-6xl md:text-5xl font-bold">0</p>
            </section>
            <section class="bg-zinc-950 border-2 border-zinc-700 rounded-xl p-4 flex flex-col items-center space-y-2 shadow-2xl min-w-[160px]">
                <p class="text-zinc-300 text-sm font-semibold uppercase tracking-wider">Equipo visita</p>
                <p x-text="puntosVisita" class="text-amber-500 text-6xl md:text-5xl font-bold">0</p>
            </section>
                <aside class="flex flex-col space-y-2">
                <button type="button" @click="puntosVisita++" class="w-10 h-10 rounded-full border-2 border-zinc-400 text-zinc-300 font-bold text-xl cursor-pointer hover:bg-zinc-800 flex items-center justify-center">+</button>
                <button type="button" @click="if(puntosVisita > 0) puntosVisita--" class="w-10 h-10 rounded-full border-2 border-zinc-400 text-zinc-300 font-bold text-xl cursor-pointer hover:bg-zinc-800 flex items-center justify-center">-</button>
                </aside>
        </div>

    </section>

</body>
</html>
